# PostgreSQL profile. Activate with --spring.profiles.active=postgres.
#
# Credentials come from the environment; the defaults below are local
# development conveniences only. Do not commit real credentials here.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/todo}
spring.datasource.username=${POSTGRES_USER:todo}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# The H2 console belongs to the in-memory development database only.
spring.h2.console.enabled=false
